# Postgres local para desarrollo y tests de integración.
# Uso: docker compose up -d   (credenciales iguales a .env.example y al CI)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
      POSTGRES_DB: gym_dev
    ports:
      - "5432:5432"
    volumes:
      - gym-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  gym-db:
